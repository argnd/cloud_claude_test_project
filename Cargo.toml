[package]
name = "dungeon_crawler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = "0.36.2"
rand = "0.10.2"
image = "0.25.10"

# Smaller, faster exe for `cargo build --release`; debug builds are untouched.
[profile.release]
lto = true
codegen-units = 1
strip = true
